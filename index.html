<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livre d'or – Grâce & Joël</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --eucalyptus: #94A684;
            --peach: #E6A4B4;
            --blush: #F3D7D7;
            --cream: #FFFDF9;
            --dark: #4A4A4A;
        }

        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--cream);
            color: var(--dark);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            color: var(--eucalyptus);
            margin-bottom: 10px;
        }

        .subtitle {
            font-style: italic;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            margin-bottom: 30px;
            color: var(--dark);
        }

        .instructions {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            margin-bottom: 30px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .instructions i {
            color: var(--peach);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .widget-box {
            background: white;
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 2px dashed var(--blush);
            min-height: 450px;
        }

        iframe {
            width: 100%;
            height: 480px;
            border: none;
            border-radius: 15px;
        }

        footer {
            margin-top: 50px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: var(--peach);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Le Livre d'Or Vidéo & Audio</h1>
    <div class="subtitle">Grâce & Joël — 4 Juillet 2026</div>

    <div class="instructions">
        <i class="fa-solid fa-camera-retro"></i>
        <p>Laissez un message éternel aux mariés ! <br>
        Cliquez ci-dessous pour vous enregistrer en <strong>vidéo</strong>, laisser un message <strong>audio</strong> ou importer un souvenir depuis votre téléphone.</p>
    </div>

    <div class="widget-box">
        <iframe src="https://tally.so/embed/EkZkvr?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" title="Livre d'or G&J"></iframe>
    </div>

    <footer>Merci pour votre amour et votre présence...</footer>
</div>

</body>
</html>
